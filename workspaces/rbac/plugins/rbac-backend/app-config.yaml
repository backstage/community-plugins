# Self-contained config for the RBAC backend dev harness.
# Usage: yarn workspace @backstage-community/plugin-rbac-backend start
#
# Optional local overrides: app-config.local.yaml beside this file (gitignored).

app:
  baseUrl: http://localhost:3000

organization:
  name: RBAC Dev

backend:
  baseUrl: http://localhost:7007
  listen:
    port: 7007
  cors:
    origin: http://localhost:3000
    methods: [GET, HEAD, PATCH, POST, PUT, DELETE]
    credentials: true
  database:
    client: better-sqlite3
    connection: ':memory:'

auth:
  environment: development
  providers:
    guest:
      # Match catalog User + permission.rbac.admin.superUsers for e2e seeding.
      userEntityRef: user:default/guest
      ownershipEntityRefs: [user:default/guest]

catalog:
  rules:
    - allow: [Component, System, API, Resource, Location, Template, User, Group]
  locations:
    - type: file
      target: ../../examples/entities.yaml
    - type: file
      target: ../../examples/template/template.yaml
      rules:
        - allow: [Template]
    - type: file
      target: ../../examples/org.yaml
      rules:
        - allow: [User, Group]
    - type: file
      target: ../rbac/tests/fixtures/catalog-org.yaml
      rules:
        - allow: [User, Group]

permission:
  enabled: true
  rbac:
    pluginsWithPermission:
      - catalog
      - permission
      - scaffolder
    # Guest is a super user so e2e can seed/edit REST roles. Do not use
    # admin.users here — that creates a read-only configuration rbac_admin.
    admin:
      superUsers:
        - name: user:development/guest
        - name: user:default/guest
