backend:
  baseUrl: http://localhost:7007
  listen:
    port: 7007
  auth:
    externalAccess:
      - type: static
        options:
          token: ${BACKSTAGE_DEV_STATIC_TOKEN}
          subject: user:default/guest
  logger:
    level: info
    overrides:
      - matchers:
          plugin: catalog
        level: debug

catalog:
  rules:
    - allow: [Component, User, Location]
  locations:
    - type: file
      target: ./examples/entities.yaml
    - type: file
      target: ./examples/org.yaml
      rules:
        - allow: [User]
