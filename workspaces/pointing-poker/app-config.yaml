app:
  title: Pointing Poker Example App
  baseUrl: http://localhost:3000
  experimental:
    packages: 'all'

organization:
  name: Pointing Poker Example

backend:
  baseUrl: http://localhost:7007
  listen:
    port: 7007
  csp:
    connect-src: ["'self'", 'http:', 'https:']
    img-src:
      [
        "'self'",
        'data:',
        'https://*.atlassian.net',
        'https://secure.gravatar.com',
      ]
  cors:
    origin: http://localhost:3000
    methods: [GET, HEAD, PATCH, POST, PUT, DELETE]
    credentials: true
  database:
    client: better-sqlite3
    connection: ':memory:'

auth:
  providers:
    guest: {}

catalog:
  locations:
    - type: file
      target: ../../examples/org.yaml
      rules:
        - allow: [User, Group]

pointingPoker:
  providers:
    jira:
      host: ${JIRA_HOST}
      email: ${JIRA_USER_EMAIL}
      apiToken: ${JIRA_API_TOKEN}
