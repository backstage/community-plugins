backend:
  baseUrl: http://localhost:7007
  listen:
    port: 7007
  auth:
    # Dev-only static token for curl and other local API checks. Do not use in production.
    # Export BACKSTAGE_DEV_STATIC_TOKEN (min 8 chars) before starting the harness.
    externalAccess:
      - type: static
        options:
          token: ${BACKSTAGE_DEV_STATIC_TOKEN}
          subject: user:default/guest
