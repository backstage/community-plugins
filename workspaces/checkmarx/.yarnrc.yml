    dependencies:
      jest-cli: ^29.7.0
      jest-environment-node: ^29.7.0
      jest-runtime: ^29.7.0
      yaml: ^2.8.1

plugins:
  - checksum: 8656d315fde813c3975dc9fa9e3fdaa1309db24dee6f70c6de7337dd45319ad352b928153ce88477dc3a33128ec9bd5037d2e482b26321d4e76531a8e424142b
    path: .yarn/plugins/@yarnpkg/plugin-backstage.cjs
    spec: 'https://versions.backstage.io/v1/releases/1.57.1/yarn-plugin'
