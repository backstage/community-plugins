name: Automate Renovate and Dependabot changeset
on:
  pull_request_target:
    paths:
      - '**/package.json'
      - '**/yarn.lock'

permissions: {}

jobs:
  generate-changeset:
    runs-on: ubuntu-latest
    if: |
      (
        (github.actor == 'backstage-goalie[bot]' && startsWith(github.head_ref, 'renovate/'))
        || (github.actor == 'dependabot[bot]' && startsWith(github.head_ref, 'dependabot/'))
      )
      && github.repository == 'backstage/community-plugins'
      && github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@63c24ba6bd7ba022e95695ff85de572c04a18142 # v2.7.0
        with:
          egress-policy: audit

      # Tooling comes from the base branch. The PR is checked out separately
      # without credentials, and none of its code is run with the token.
      - name: Checkout base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: base
          persist-credentials: false

      - name: Checkout PR
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: pr
          fetch-depth: 2
          ref: ${{ github.head_ref }}
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.x

      - name: Configure Git
        working-directory: pr
        run: |
          git config user.email noreply@backstage.io
          git config user.name 'Github changeset workflow'

      # Dependabot doesn't dedupe lockfiles, which fails the duplicate check in CI.
      # update-lockfile mode only rewrites yarn.lock, it doesn't fetch packages or
      # run their install scripts. Yarn loads its binary and plugins from the
      # checkout, so this only runs when those match the base branch.
      - name: Dedupe lockfiles
        if: github.actor == 'dependabot[bot]'
        working-directory: pr
        run: |
          same() { diff -rq "../base/$1" "$1" > /dev/null 2>&1 || { [ ! -e "../base/$1" ] && [ ! -e "$1" ]; }; }

          for lockfile in $(git diff --name-only HEAD~1 -- 'workspaces/*/yarn.lock'); do
            dir=$(dirname "$lockfile")
            if ! { same .yarnrc.yml && same .yarn && same package.json && same "$dir/.yarnrc.yml" && same "$dir/.yarn"; }; then
              echo "::warning::Yarn config differs from the base branch, skipping dedupe for $lockfile"
              continue
            fi
            echo "Deduping $lockfile"
            yarn --cwd "$dir" dedupe --mode=update-lockfile
            git add "$lockfile"
          done

      - name: Generate changesets
        working-directory: pr
        run: node ../base/scripts/ci/generate-bump-changesets.js

      - name: Commit and push
        working-directory: pr
        env:
          TOKEN: ${{ secrets.GH_SERVICE_ACCOUNT_TOKEN }}
          BRANCH: ${{ github.head_ref }}
          REPO: ${{ github.repository }}
        run: |
          if git diff --cached --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          git commit --amend --no-edit --no-verify
          git push --force "https://x-access-token:${TOKEN}@github.com/${REPO}.git" "HEAD:refs/heads/${BRANCH}"
