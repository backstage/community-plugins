name: Automate Renovate and Dependabot changeset
on:
  pull_request_target:
    paths:
      - '**/package.json'

jobs:
  generate-changeset:
    runs-on: ubuntu-latest
    if: |
      (github.actor == 'backstage-goalie[bot]' || github.actor == 'dependabot[bot]')
      && github.repository == 'backstage/community-plugins'
      && github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@63c24ba6bd7ba022e95695ff85de572c04a18142 # v2.7.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          ref: ${{ github.head_ref }}
          token: ${{ secrets.GH_SERVICE_ACCOUNT_TOKEN }}
          allow-unsafe-pr-checkout: true

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.x
          registry-url: https://registry.npmjs.org/ # Needed for auth

      - name: Configure Git
        run: |
          git config --global user.email noreply@backstage.io
          git config --global user.name 'Github changeset workflow'

      - name: Generate changesets
        run: node ./scripts/ci/generate-bump-changesets.js
