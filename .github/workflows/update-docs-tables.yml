name: Update Docs Tables

permissions:
  contents: write
  pull-requests: write

on:
  workflow_dispatch:

jobs:
  update-docs-tables:
    name: Update Docs Tables
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@63c24ba6bd7ba022e95695ff85de572c04a18142 # v2.7.0
        with:
          egress-policy: audit

      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@60edb5dd545a775178f52524783378180af0d1f8 # v4
        with:
          node-version: 22.x
          registry-url: https://registry.npmjs.org/

      - name: Install dependencies
        run: yarn install --immutable

      - name: Update compatibility table
        run: node scripts/list-compatibility.js --save

      - name: Update workspaces table
        run: node scripts/list-workspaces-for-docs.js --save

      - name: Update new frontend system table
        run: node scripts/list-feature.js --role frontend --save

      - name: Check for changes
        id: changes
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "has_changes=true" >> $GITHUB_OUTPUT
          else
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "No changes detected, skipping PR creation."
          fi

      - name: Configure git
        if: steps.changes.outputs.has_changes == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Create branch and commit
        if: steps.changes.outputs.has_changes == 'true'
        run: |
          git checkout -b automated/update-docs-tables
          git add docs/README.md docs/compatibility/compatibility.md docs/compatibility/new-frontend-system.md
          git commit -s -m "docs: update auto-generated docs tables"
          git push -f origin automated/update-docs-tables

      - name: Create pull request
        if: steps.changes.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! gh pr list --head automated/update-docs-tables --state open | grep -q .; then
            gh pr create \
              --title "docs: update auto-generated docs tables" \
              --body "$(cat <<'EOF'
          This PR updates the auto-generated documentation tables:

          - [`docs/compatibility/compatibility.md`](https://github.com/backstage/community-plugins/blob/main/docs/compatibility/compatibility.md) — workspace version compatibility
          - [`docs/README.md`](https://github.com/backstage/community-plugins/blob/main/docs/README.md) — workspaces and their plugins
          - [`docs/compatibility/new-frontend-system.md`](https://github.com/backstage/community-plugins/blob/main/docs/compatibility/new-frontend-system.md) — new frontend system support

          Generated by the `update-docs-tables` workflow.
          EOF
          )" \
              --label "documentation"
          fi
